verify_jwt = false

[functions.send-sms]
verify_jwt = false

[functions.send-confirmation-email]
verify_jwt = false

[functions.send-owner-notification]
verify_jwt = false

[functions.realtime-session]
verify_jwt = false

[functions.get-user-by-phone]
verify_jwt = false

[functions.create-booking-manual]
